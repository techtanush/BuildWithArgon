<!doctype html><html><head><meta charset="utf-8"><title>Asset +Z orientation review</title><style>body{margin:0;background:#20252a;color:#eef;font:14px system-ui}h1{margin:10px;font-size:20px}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}.tile{height:170px;border:1px solid #64707a;position:relative}.label{position:absolute;top:6px;left:8px;z-index:2}canvas{position:absolute;top:0;left:0;pointer-events:none}.status{padding:8px;font-size:12px}</style></head><body><h1>Source front inspection: camera looks from +Z</h1><div class="status" id="status">Loading actual built GLBs...</div><div id="grid"></div><script type="module">
import * as THREE from 'three';import {GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{MeshoptDecoder}from'three/addons/libs/meshopt_decoder.module.js';
const manifest=await(await fetch('/assets/manifest.json')).json();const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);const views=[];for(const model of manifest.models){const tile=document.createElement('div');tile.className='tile';tile.innerHTML=`<span class="label">${model.id}<br>+Z front, ${model.triangles} tris</span>`;document.querySelector('#grid').appendChild(tile);const scene=new THREE.Scene();scene.background=new THREE.Color('#353c42');scene.add(new THREE.HemisphereLight(0xffffff,0x8b7861,3));const light=new THREE.DirectionalLight(0xffffff,4);light.position.set(3,5,5);scene.add(light);try{const gltf=await loader.loadAsync(model.url);scene.add(gltf.scene);const box=new THREE.Box3().setFromObject(gltf.scene),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());const camera=new THREE.PerspectiveCamera(35,1,.01,100);const span=Math.max(size.x,size.y,size.z);camera.position.set(center.x,center.y+size.y*.15,center.z+span*2.4);camera.lookAt(center);views.push({tile,scene,camera});}catch(e){tile.innerHTML+=`<p>${String(e)}</p>`;}}
function draw(){renderer.setSize(document.documentElement.clientWidth,document.documentElement.scrollHeight);renderer.setScissorTest(true);for(const v of views){const r=v.tile.getBoundingClientRect();const y=document.documentElement.scrollHeight-(r.top+window.scrollY)-r.height;renderer.setViewport(r.left,r.height?y:0,r.width,r.height);renderer.setScissor(r.left,y,r.width,r.height);v.camera.aspect=r.width/r.height;v.camera.updateProjectionMatrix();renderer.render(v.scene,v.camera);}}draw();document.querySelector('#status').textContent=`Loaded ${views.length}/${manifest.models.length} models. This page does not auto-certify source orientation.`;window.addEventListener('resize',draw);
</script></body></html>
