<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Voice Lab</title><style>body{font:16px system-ui;max-width:850px;margin:30px auto;background:#faf8f1;color:#222}button,input,textarea,select{font:inherit;padding:10px;margin:5px}textarea{width:90%}pre{white-space:pre-wrap}canvas{background:#eee;border-radius:20px}label{display:block}</style><h1>Voice lab</h1><p>Real browser and kernel audio only. No simulated successful providers. Microphone requires localhost or HTTPS.</p><label>Venture ID <input id="venture" placeholder="venture id"></label><label>Agent ID <input id="agent" value="concierge"></label><label>STT <select id="stt"><option value="server">Server, browser fallback</option><option value="browser">Browser</option></select></label><button id="hold">Hold to talk</button><textarea id="text">Hello, welcome to Foundry.</textarea><label>Speech <select id="driver"><option value="browser">Browser boundaries</option><option value="server">Kernel TTS (alignment or analyser)</option></select></label><button id="speak">Speak</button><button id="stop">Stop</button><button id="call">Call agent</button><button id="end">End call</button><label><input id="muted" type="checkbox">Mute call microphone</label><canvas width="400" height="180" id="mouth"></canvas><p id="status" role="status">Ready. Type at any time.</p><pre id="transcript"></pre><pre id="answers"></pre><script type="module" src="./main.ts"></script></html>
