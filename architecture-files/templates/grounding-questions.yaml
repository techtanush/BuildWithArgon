- id: G-18
  ask: concierge
  question: "What's our monthly revenue?"
  must_include_any: [["don't know", "do not know", "no record", "not sure", "don't have", "no revenue", "haven't"]]
  must_cite_any: []
  must_not_match: ["\\$\\s?\\d+[\\d,]*(?:\\.\\d+)?\\s*(?:/|per)\\s*month"]

- id: G-19
  ask: li.lead-researcher
  question: "Which companies are our best leads?"
