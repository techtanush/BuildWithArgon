# Grounding eval questions over templates/grounding-fixture.json ("Pantry Pal").
# Scoring rules: architecture-files/06-execution/04-evals.md §2.
# must_include_any: every inner list is a group of alternatives; each group must match (case-insensitive).

- id: G-01
  ask: concierge
  question: "What's waiting on me right now?"
  must_include_any: [["PR #7", "pull request 7", "search"], ["approv"]]
  must_cite_any: [apr_EVAL_MERGE7, apr_EVAL_OUTREACH]

- id: G-02
  ask: concierge
  question: "Who built the search feature?"
  must_include_any: [["Zara"]]
  must_cite_any: [tkt_EVAL_SEARCH, art_EVAL_PR7]
  expect_route: eng.builder

- id: G-03
  ask: concierge
  question: "Where can I find the competitor research?"
  must_include_any: [["Priya", "Market Research", "Observatory"]]
  must_cite_any: [art_EVAL_MARKET]
  expect_route: mr.research-lead

- id: G-04
  ask: concierge
  question: "How much have we spent so far?"
  must_include_any: [["6.40", "6.4"]]
